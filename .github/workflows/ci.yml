name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API y D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/api
      - run: pnpm run typecheck && pnpm test
        working-directory: apps/api
      - run: |
          cp .dev.vars.example .dev.vars
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler dev --local --ip 127.0.0.1 > /tmp/neversion-api.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          node ../../scripts/api-smoke.mjs || { cat /tmp/neversion-api.log; exit 1; }
          pnpm exec wrangler deploy --dry-run --outdir /tmp/neversion-worker
        working-directory: apps/api

  mobile:
    name: Aplicación móvil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - run: pnpm run typecheck && pnpm run lint && pnpm exec expo export --platform android --platform ios
        working-directory: apps/mobile
