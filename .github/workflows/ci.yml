name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API y D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck && npm test
        working-directory: apps/api
      - run: |
          cp .dev.vars.example .dev.vars
          npx --no-install wrangler d1 migrations apply DB --local
          npx --no-install wrangler dev --local --ip 127.0.0.1 > /tmp/neversion-api.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          node ../../scripts/api-smoke.mjs || { cat /tmp/neversion-api.log; exit 1; }
          npx --no-install wrangler deploy --dry-run --outdir /tmp/neversion-worker
        working-directory: apps/api

  mobile:
    name: Aplicación móvil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck && npm run lint && npx --no-install expo export --platform android --platform ios
        working-directory: apps/mobile
